{% extends "base.html" %}
{% block title %}경험 발굴 — {{ user }}{% endblock %}

{% block content %}
<style>
  .elicit-layout { display:flex; gap:16px; align-items:flex-start; }
  .chat-col { flex:1 1 60%; min-width:0; }
  .side-col { flex:1 1 34%; min-width:220px; max-width:320px; }
  @media (max-width:700px) { .elicit-layout { flex-direction:column; } .side-col { max-width:none; } }

  #chatBox { height:460px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:80%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .bubble.assistant { background:#f0f0f5; align-self:flex-start; border-bottom-left-radius:4px; }
  .bubble.user { background:#0066cc; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .bubble.pending { color:#6e6e73; font-style:italic; }

  #chatForm { display:flex; gap:8px; padding:12px; border-top:1px solid #d2d2d7; }
  #chatInput { flex:1; padding:9px 12px; border:1px solid #d2d2d7; border-radius:8px; font-size:14px; font-family:inherit; resize:none; }
  #chatInput:focus { outline:none; border-color:#0066cc; }

  .exp-card { padding:10px 12px; border:1px solid #d2d2d7; border-radius:10px; margin-bottom:10px; font-size:13px; }
  .exp-card .title { font-weight:500; margin-bottom:4px; }
  .exp-empty { color:#6e6e73; font-size:12px; padding:8px 0; }
</style>

<div style="margin-bottom:20px; font-size:13px; color:#6e6e73;">
  <a href="/">홈</a>
  <span style="margin:0 6px;">›</span>
  <a href="/user/{{ user }}">{{ user }}</a>
  <span style="margin:0 6px;">›</span>
  경험 발굴
</div>

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
  <h1 style="margin:0">대화로 경험 만들기</h1>
  <a href="/user/{{ user }}" class="btn btn-secondary">마치기</a>
</div>

<div class="elicit-layout">
  <div class="chat-col">
    <div class="card" style="padding:0; overflow:hidden;">
      <div id="chatBox"></div>
      <form id="chatForm" onsubmit="return false;">
        <textarea id="chatInput" rows="1" placeholder="답변을 입력하세요..." onkeydown="onInputKeydown(event)"></textarea>
        <button type="button" class="btn btn-primary" id="sendBtn" onclick="send()">보내기</button>
      </form>
    </div>
  </div>

  <div class="side-col">
    <div class="card">
      <h2 style="margin-bottom:10px; font-size:14px;">확정된 경험</h2>
      <div id="savedList">
        <p class="exp-empty">아직 없습니다. 대화를 마치면 여기 쌓입니다.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let history = [];      // 서버에 매 턴 그대로 보내는 대화 기록 ({role, content}[])
let sending = false;

function addBubble(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

async function callElicit(userMessage) {
  const res = await fetch('/elicit/{{ user }}', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history, message: userMessage || '' }),
  });
  return res.json();
}

async function send() {
  if (sending) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  addBubble('user', text);
  input.value = '';
  sending = true;
  document.getElementById('sendBtn').disabled = true;
  const pending = addBubble('assistant pending', '...');

  try {
    const data = await callElicit(text);
    pending.remove();
    if (!data.success) {
      addBubble('assistant', '⚠️ ' + (data.error || '오류가 발생했습니다.'));
      return;
    }
    history = data.messages;
    addBubble('assistant', data.reply);
    if (data.saved) addSavedCard(data.saved);
  } catch (e) {
    pending.remove();
    addBubble('assistant', '⚠️ 요청 중 오류: ' + e.message);
  } finally {
    sending = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

function addSavedCard(saved) {
  const list = document.getElementById('savedList');
  const empty = list.querySelector('.exp-empty');
  if (empty) empty.remove();
  const card = document.createElement('div');
  card.className = 'exp-card';
  card.innerHTML = `
    <div class="title">✅ ${escapeHtml(saved.title)}</div>
    <a href="/experience/{{ user }}/${encodeURIComponent(saved.filename)}" class="btn btn-secondary btn-sm">열기 / 편집</a>
  `;
  list.appendChild(card);
  toast(`"${saved.title}" 저장 완료`);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 페이지가 열리면 서버가 Step 0 인사를 먼저 보내온다 (사용자가 아무것도 입력하지 않은 시작 신호).
(async function start() {
  const pending = addBubble('assistant pending', '대화를 준비하고 있습니다...');
  try {
    const data = await callElicit('');
    pending.remove();
    if (data.success) {
      history = data.messages;
      addBubble('assistant', data.reply);
    } else {
      addBubble('assistant', '⚠️ ' + (data.error || '시작하지 못했습니다.'));
    }
  } catch (e) {
    pending.remove();
    addBubble('assistant', '⚠️ 시작 중 오류: ' + e.message);
  }
})();
</script>
{% endblock %}
