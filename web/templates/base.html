<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}자소서 시스템{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f5f5f7; color: #1d1d1f; font-size: 14px; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* nav */
    nav { background: #fff; border-bottom: 1px solid #d2d2d7; padding: 0 24px;
          display: flex; align-items: center; gap: 20px; height: 48px; position: sticky; top: 0; z-index: 10; }
    nav .brand { font-weight: 600; font-size: 15px; color: #1d1d1f; }
    nav a { color: #6e6e73; font-size: 13px; }

    /* layout */
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #1d1d1f; }

    /* cards */
    .card { background: #fff; border: 1px solid #d2d2d7; border-radius: 12px; padding: 20px; margin-bottom: 16px; }

    /* table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; color: #6e6e73; font-weight: 500;
         padding: 8px 12px; border-bottom: 1px solid #d2d2d7; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f5; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f5f5f7; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
           border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
           border: none; transition: background .15s; }
    .btn-primary { background: #0066cc; color: #fff; }
    .btn-primary:hover { background: #0055b3; }
    .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
    .btn-secondary:hover { background: #d2d2d7; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* badge */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .badge-warn { background: #fff3cd; color: #856404; }
    .badge-ok   { background: #d1e7dd; color: #0a3622; }

    /* tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #d2d2d7; }
    .tab { padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
           color: #6e6e73; font-weight: 500; margin-bottom: -1px; }
    .tab.active { color: #0066cc; border-bottom-color: #0066cc; }

    /* toast */
    #toast { position: fixed; bottom: 24px; right: 24px; background: #1d1d1f; color: #fff;
             padding: 12px 18px; border-radius: 10px; font-size: 13px; opacity: 0;
             transition: opacity .25s; pointer-events: none; z-index: 100; }
    #toast.show { opacity: 1; }

    /* misc */
    .empty { color: #6e6e73; font-size: 13px; padding: 16px 0; }
    .warn-icon { color: #856404; }
  </style>
</head>
<body>
<nav>
  <span class="brand">📄 자소서 시스템</span>
  <a href="/">홈</a>
  <a href="/jobs">공고</a>
  <a href="/trends">트렌드</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script>
function toast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
