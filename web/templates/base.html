<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}자소서 시스템{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 고도화(2026-09-27): "케이스 파일" 디자인 시스템. 종이 같은 연회녹 배경 + 짙은
       네이비그린 잉크, 상태는 의미별로 다른 색(마감임박=호박/준비중=파랑/결과대기=보라/
       합격=청록/불합격=러스트)을 쓴다 — 지원 파이프라인 앱이라 "무엇에 신경 써야 하는지"
       가 색으로 바로 읽혀야 한다고 판단했다. 토큰으로 선언해서 라이트/다크 모두 지원한다. */
    :root {
      color-scheme: light dark;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      --paper: #EDF0EA;
      --surface: #F8FAF6;
      --surface-sunk: #E3E8DF;
      --ink: #1C231F;
      --ink-soft: #576155;
      --ink-faint: #8A9187;
      --rule: #CBD2C5;
      --accent: #14665A;
      --accent-soft: #DCEBE6;
      --gold: #93741F;

      --st-progress: #2D5F8A;      --st-progress-soft: #DDE8F1;
      --st-wait: #6B5B95;          --st-wait-soft: #E7E1F1;
      --st-warn: #9C6B14;          --st-warn-soft: #F3E7CE;
      --st-good: #14665A;          --st-good-soft: #DCEBE6;
      --st-bad: #9C3D1F;           --st-bad-soft: #F3E2D9;

      --shadow: 0 1px 2px rgba(28,35,31,0.06), 0 10px 28px -14px rgba(28,35,31,0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #14181A; --surface: #1B211F; --surface-sunk: #10140F;
        --ink: #E7EAE3; --ink-soft: #A7B0A9; --ink-faint: #6B746D;
        --rule: #333C37;
        --accent: #48B39F; --accent-soft: #17332D;
        --gold: #D8B65C;
        --st-progress: #6FA8D6; --st-progress-soft: #1B2C3A;
        --st-wait: #B3A2DD; --st-wait-soft: #2A2438;
        --st-warn: #E0B454; --st-warn-soft: #362A12;
        --st-good: #48B39F; --st-good-soft: #17332D;
        --st-bad: #E28457; --st-bad-soft: #3A2417;
        --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.55);
      }
    }
    :root[data-theme="dark"] {
      --paper: #14181A; --surface: #1B211F; --surface-sunk: #10140F;
      --ink: #E7EAE3; --ink-soft: #A7B0A9; --ink-faint: #6B746D;
      --rule: #333C37;
      --accent: #48B39F; --accent-soft: #17332D;
      --gold: #D8B65C;
      --st-progress: #6FA8D6; --st-progress-soft: #1B2C3A;
      --st-wait: #B3A2DD; --st-wait-soft: #2A2438;
      --st-warn: #E0B454; --st-warn-soft: #362A12;
      --st-good: #48B39F; --st-good-soft: #17332D;
      --st-bad: #E28457; --st-bad-soft: #3A2417;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.6;
           -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    /* nav */
    nav { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0 24px;
          display: flex; align-items: center; gap: 20px; height: 52px;
          position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
    nav .brand { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 16px; color: var(--ink); }
    nav a { color: var(--ink-soft); font-size: 13px; }
    nav a:hover { color: var(--ink); }

    /* layout */
    main { max-width: 960px; margin: 0 auto; padding-inline: 24px; padding-block: 32px; }
    h1 { font-family: 'Gowun Batang', serif; font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }

    /* cards */
    .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
            padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }

    /* table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
         color: var(--ink-faint); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-sunk); }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
           border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer;
           border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
           transition: border-color .15s, filter .15s; }
    .btn:hover { border-color: var(--ink-faint); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
    .btn-secondary { background: var(--surface); color: var(--ink); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* badge */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-warn { background: var(--st-warn-soft); color: var(--st-warn); }
    .badge-ok   { background: var(--st-good-soft); color: var(--st-good); }
    .badge-bad  { background: var(--st-bad-soft); color: var(--st-bad); }
    .badge-info { background: var(--st-progress-soft); color: var(--st-progress); }

    /* tabs */
    .tabs { display: flex; gap: 4px; background: var(--surface-sunk); border-radius: 9px;
            padding: 4px; margin-bottom: 20px; width: fit-content; }
    .tab { padding: 7px 16px; font-size: 13px; cursor: pointer; border: none; background: transparent;
           color: var(--ink-soft); font-weight: 500; border-radius: 6px; }
    .tab.active { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }

    /* toast */
    #toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: 24px;
             background: var(--ink); color: var(--paper);
             padding: 12px 18px; border-radius: 10px; font-size: 13px; opacity: 0;
             transition: opacity .25s; pointer-events: none; z-index: 100; }
    #toast.show { opacity: 1; }

    /* misc */
    .empty { color: var(--ink-soft); font-size: 13px; padding: 16px 0; }
    .warn-icon { color: var(--st-warn); }
  </style>
</head>
<body>
<nav>
  <span class="brand">📄 자소서 시스템</span>
  <a href="/">홈</a>
  <a href="/jobs">공고</a>
  <a href="/trends">트렌드</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script>
function toast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
